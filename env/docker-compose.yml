# BookShelf code-quality lab
#   ../bin/lab up      start SonarQube + PostgreSQL + Jenkins + Gitea
#   ../bin/lab down    stop everything (data is kept in volumes)
name: sonarlab

services:
  sonarqube:
    image: sonarqube:${SONARQUBE_TAG:-community}
    container_name: sonarqube
    depends_on: [db]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
      nproc: 8192
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    image: sonarlab/jenkins:lts
    container_name: jenkins
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    restart: unless-stopped

  gitea:
    image: gitea/gitea:${GITEA_TAG:-1.24}
    container_name: gitea
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__DOMAIN: localhost
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data
    restart: unless-stopped

volumes:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-db:
  jenkins-home:
  gitea-data:

networks:
  default:
    name: sonarlab
